[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
allow_paths = ["../../../citrate_v0.01.1/contracts/src"]

# Remap to shared Citrate contract sources
remappings = [
    "citrate-contracts/=../../../citrate_v0.01.1/contracts/src/",
]

gas_reports = ["PatentNFT", "KYCRegistry", "PatentLicense", "PatentMarketplace"]

[rpc_endpoints]
citrate = "http://localhost:8545"

[profile.citrate]
via_ir = true
optimizer = true
optimizer_runs = 10000
