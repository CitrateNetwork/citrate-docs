[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
allow_paths = ["../../../citrate_v0.01.1/contracts/src"]

# Remap to shared Citrate contract sources
remappings = [
    "citrate-contracts/=../../../citrate_v0.01.1/contracts/src/",
]

[rpc_endpoints]
citrate = "http://localhost:8545"
