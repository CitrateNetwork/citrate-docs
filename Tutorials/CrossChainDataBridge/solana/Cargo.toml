[package]
name = "citrate-crosschain-gateway"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
borsh = "0.10.3"
solana-program = "1.18.22"

[dev-dependencies]
solana-program-test = "1.18.22"
solana-sdk = "1.18.22"
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread"] }

[features]
no-entrypoint = []
