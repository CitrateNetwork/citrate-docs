name: ci

# Tier-1 CI gate for Citrate Codex. Build + typecheck + the ConfidentialNeverInBuild invariant
# (verify:bundle) + SBOM. A failure here blocks merge/release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (access-control chokepoint — vitest)
        run: npm test
      - name: Build (prebuild=content, postbuild=verify:bundle)
        run: npm run build
      - name: Confidential-never-in-build gate
        run: npm run verify:bundle
      - name: Content lint (em-dash + vocabulary gate, strict)
        run: npm run content-lint -- --strict
      - name: SBOM (CycloneDX)
        run: npm run sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-sbom
          path: sbom.cyclonedx.json
