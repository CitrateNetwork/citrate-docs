name: CodeQL

# Advanced CodeQL setup (PBA-L7-007). Default setup cannot read a config file,
# so it scanned the vendored Solana crates under
# Tutorials/CrossChainDataBridge/solana/vendor/ (462 of 464 open high/critical
# alerts). This workflow runs the same languages and the default query suite
# as the default setup did, with .github/codeql/codeql-config.yml excluding
# only that vendored tree.
#
# Activation (ORCHESTRATOR, after merge): switch the repo from default to
# advanced setup, otherwise this workflow's upload is rejected:
#   gh api -X PATCH repos/CitrateNetwork/citrate-docs/code-scanning/default-setup -f state=not-configured

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
